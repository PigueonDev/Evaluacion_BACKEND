<!DOCTYPE html>
{% load static %}
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block titulo %}Blockbuster{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>
<body>
    <div class="container">
        <!-- Inicio del menú de navegación -->
        <nav class="navbar navbar-expand-lg navbar-dark bg-primary mt-2 rounded">
            <div class="container-fluid">
                <a class="navbar-brand" href="{% url 'home' %}"><i class="bi bi-film"></i> Blockbuster</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuPrincipal" aria-controls="menuPrincipal" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="menuPrincipal">
                    <ul class="navbar-nav me-auto">
                        <li class="nav-item"><a class="nav-link" href="{% url 'home' %}">Inicio</a></li>
                        <li class="nav-item dropdown">
                            <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">Catálogo</a>
                            <ul class="dropdown-menu">
                                <li><a class="dropdown-item" href="{% url 'catalogo_home' %}">Resumen</a></li>
                                <li><a class="dropdown-item" href="{% url 'catalogo_peliculas' %}">Películas</a></li>
                                <li><a class="dropdown-item" href="{% url 'catalogo_generos' %}">Géneros</a></li>
                                <li><a class="dropdown-item" href="{% url 'catalogo_directores' %}">Directores</a></li>
                            </ul>
                        </li>
                        <li class="nav-item dropdown">
                            <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">Clientes</a>
                            <ul class="dropdown-menu">
                                <li><a class="dropdown-item" href="{% url 'clientes_home' %}">Resumen</a></li>
                                <li><a class="dropdown-item" href="{% url 'clientes_lista' %}">Clientes</a></li>
                                <li><a class="dropdown-item" href="{% url 'clientes_arriendos' %}">Arriendos</a></li>
                            </ul>
                        </li>
                        <li class="nav-item"><a class="nav-link" href="{% url 'admin:index' %}">Administrador</a></li>
                    </ul>
                </div>
            </div>
        </nav>
        <!-- Fin del menú de navegación -->

        {% block contenido %}{% endblock %}
    </div>
    <script src="{% static 'js/bootstrap.bundle.min.js' %}"></script>
</body>
</html>
