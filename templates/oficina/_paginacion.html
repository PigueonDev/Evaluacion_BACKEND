{% if pagina.paginator.num_pages > 1 %}
<nav class="mt-3" aria-label="Paginación"><ul class="pagination flex-wrap">
    {% if pagina.has_previous %}<li class="page-item"><a class="page-link" href="?{{ parametros }}&pagina={{ pagina.previous_page_number }}">Anterior</a></li>{% endif %}
    <li class="page-item disabled"><span class="page-link">Página {{ pagina.number }} de {{ pagina.paginator.num_pages }}</span></li>
    {% if pagina.has_next %}<li class="page-item"><a class="page-link" href="?{{ parametros }}&pagina={{ pagina.next_page_number }}">Siguiente</a></li>{% endif %}
</ul></nav>
{% endif %}
