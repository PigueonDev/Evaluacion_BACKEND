# Máximo 10 intentos de login por minuto por IP (además del bloqueo que aplica Django).
limit_req_zone $binary_remote_addr zone=login_laserena:10m rate=10r/m;

server {
    listen 80;
    server_name _;

    server_tokens off;
    client_max_body_size 6M;

    # Bloquea archivos ocultos (.env, .git, etc.), excepto la validación de certificados HTTPS.
    location ~ /\.(?!well-known/) {
        return 404;
    }

    location /static/ {
        alias /var/www/negocio/staticfiles/;
        add_header X-Content-Type-Options nosniff always;
    }

    # Las evidencias no son públicas: Django revisa la sesión y responde con X-Accel-Redirect.
    location /media-protegida/ {
        internal;
        alias /var/www/negocio/media/;
        add_header X-Content-Type-Options nosniff always;
    }

    location ~ ^/(acceso|admin/login)/$ {
        limit_req zone=login_laserena burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # phpMyAdmin solo se abre si existe una sesión de personal (staff) en Django.
    # Sin sesión, Nginx redirige al login de "Acceso funcionarios".
    location = /acceso/verificar/ {
        internal;
        proxy_pass http://127.0.0.1:8000;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Original-URI $request_uri;
    }

    location @acceso_funcionarios {
        return 302 /acceso/?next=$request_uri;
    }

    location = /phpmyadmin {
        return 301 /phpmyadmin/;
    }

    location ^~ /phpmyadmin/ {
        auth_request /acceso/verificar/;
        error_page 401 = @acceso_funcionarios;

        alias /usr/share/phpmyadmin/;
        index index.php;

        location ~ ^/phpmyadmin/(setup|libraries|templates|sql|vendor|tmp|doc|examples)/ {
            return 404;
        }

        location ~ \.php$ {
            fastcgi_pass unix:/run/php-fpm/www.sock;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $request_filename;
        }
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
