server {
    listen 80;
    server_name _;

    client_max_body_size 10M;

    location /static/ {
        alias /home/ec2-user/gestion_municipal_delegacion/staticfiles/;
    }

    location /media/ {
        alias /home/ec2-user/gestion_municipal_delegacion/media/;
    }

    location / {
        include proxy_params;
        proxy_pass http://unix:/run/laserena.sock;
    }
}
